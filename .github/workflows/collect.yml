name: Collect snapshot

# Each run starts the next one ~5 minutes after it began, because GitHub's cron
# is best-effort and often skips or delays frequent schedules. The cron below is
# only a backup that restarts the chain if it ever breaks. Concurrency keeps at
# most one run pending, so duplicate chains collapse into one.
#
# To stop collecting: Actions tab -> "Collect snapshot" -> "..." -> Disable workflow.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - maizetix_tracker.py
      - dashboard_template.html
      - .github/workflows/collect.yml

permissions:
  contents: write   # commit new snapshots
  pages: write      # publish the dashboard
  id-token: write
  actions: write    # start the next run

concurrency:
  group: collect
  cancel-in-progress: false

env:
  INTERVAL_SECONDS: 300

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Note start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Collect and build dashboard
        run: |
          python3 maizetix_tracker.py collect
          python3 maizetix_tracker.py report

      # Only the small history files are committed; the listing ladder and
      # dashboard are rebuilt every run, so they don't bloat the repo.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.csv data/games.json data/listing_events.csv
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      # Runs even if an earlier step failed (e.g. MaizeTix briefly down),
      # so one bad run doesn't stop collection.
      - name: Schedule next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( STARTED + INTERVAL_SECONDS - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run collect.yml --ref main --repo "$GITHUB_REPOSITORY"

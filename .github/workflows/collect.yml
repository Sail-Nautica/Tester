name: Collect snapshot

on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub's minimum; runs often start a few minutes late
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write   # commit new snapshots
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect and build dashboard
        run: |
          python3 maizetix_tracker.py collect
          python3 maizetix_tracker.py report

      # Only the small history files are committed; the listing ladder and
      # dashboard are rebuilt every run, so they don't bloat the repo.
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.csv data/games.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
